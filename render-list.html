<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日程提醒 - 首页渲染图</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #e8e8e8;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
.phone {
  width: 375px;
  height: 812px;
  background: #f5f5f5;
  border-radius: 40px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  position: relative;
  display: flex;
  flex-direction: column;
}

/* 状态栏 */
.status-bar {
  height: 44px;
  background: #07c160;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 14px;
  font-weight: 600;
}

/* 导航栏 */
.nav-bar {
  height: 44px;
  background: #07c160;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  color: white;
}
.nav-title { font-size: 17px; font-weight: 600; }
.nav-btn { font-size: 14px; opacity: 0.9; cursor: pointer; }

/* 月历头部 */
.calendar-header {
  background: #07c160;
  padding: 8px 16px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: white;
}
.month-title { font-size: 16px; font-weight: 600; }
.arrow { font-size: 18px; cursor: pointer; opacity: 0.8; padding: 4px 8px; }

/* 日历网格 */
.calendar-grid {
  background: #07c160;
  padding: 0 12px 16px;
}
.weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  text-align: center;
  color: rgba(255,255,255,0.7);
  font-size: 12px;
  margin-bottom: 8px;
}
.days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  text-align: center;
  gap: 4px 0;
}
.day-cell {
  position: relative;
  height: 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 20px;
}
.day-num {
  font-size: 15px;
  color: white;
  line-height: 1;
}
.day-cell.other-month .day-num { color: rgba(255,255,255,0.35); }
.day-cell.today {
  background: rgba(255,255,255,0.2);
}
.day-cell.selected {
  background: white;
}
.day-cell.selected .day-num { color: #07c160; font-weight: 700; }
.day-dot {
  width: 4px; height: 4px;
  border-radius: 50%;
  background: #ffd700;
  margin-top: 3px;
}
.day-cell.selected .day-dot { background: #07c160; }

/* 选中日期信息栏 */
.date-info-bar {
  background: white;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #f0f0f0;
}
.date-info-left {
  font-size: 14px;
  color: #333;
}
.date-info-left .weekday { color: #07c160; font-weight: 600; }
.date-info-left .count { color: #999; font-size: 12px; margin-left: 8px; }

/* 日程列表 */
.schedule-list {
  flex: 1;
  overflow-y: auto;
  padding: 12px 16px;
  padding-bottom: 100px;
}

.schedule-card {
  background: white;
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 10px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.card-top {
  display: flex;
  align-items: center;
  margin-bottom: 6px;
}
.check-circle {
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 2px solid #ccc;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 10px;
  flex-shrink: 0;
  font-size: 12px;
  color: white;
}
.check-circle.checked {
  background: #07c160;
  border-color: #07c160;
}
.card-title {
  font-size: 15px;
  font-weight: 600;
  color: #1a1a1a;
  flex: 1;
}
.card-title.completed {
  text-decoration: line-through;
  color: #999;
}
.card-meta {
  display: flex;
  gap: 6px;
  margin-left: 30px;
}
.meta-tag {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 4px;
}
.tag-time { color: #576b95; background: #e8f0fb; }
.tag-remind { font-size: 14px; }
.card-detail {
  font-size: 13px;
  color: #666;
  margin-left: 30px;
  margin-top: 4px;
  line-height: 1.5;
}

/* 空状态 */
.empty-state {
  text-align: center;
  padding: 60px 0;
}
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-text { font-size: 14px; color: #999; }
.empty-hint { font-size: 12px; color: #ccc; margin-top: 4px; }

/* FAB */
.fab {
  position: absolute;
  right: 20px;
  bottom: 30px;
  width: 54px;
  height: 54px;
  background: #07c160;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 16px rgba(7,193,96,0.4);
  color: white;
  font-size: 28px;
  font-weight: 300;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="phone">
  <!-- 状态栏 -->
  <div class="status-bar">9:41</div>

  <!-- 导航栏 -->
  <div class="nav-bar">
    <div class="nav-title">我的日程</div>
    <div class="nav-btn">全部 ▾</div>
  </div>

  <!-- 月历头部 -->
  <div class="calendar-header">
    <span class="arrow">◂</span>
    <span class="month-title">2026年4月</span>
    <span class="arrow">▸</span>
  </div>

  <!-- 日历网格 -->
  <div class="calendar-grid">
    <div class="weekdays">
      <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
    </div>
    <div class="days">
      <!-- 上月占位 -->
      <div class="day-cell other-month"><span class="day-num">29</span></div>
      <div class="day-cell other-month"><span class="day-num">30</span></div>
      <div class="day-cell other-month"><span class="day-num">31</span></div>
      <!-- 本月 -->
      <div class="day-cell"><span class="day-num">1</span></div>
      <div class="day-cell"><span class="day-num">2</span></div>
      <div class="day-cell"><span class="day-num">3</span><span class="day-dot"></span></div>
      <div class="day-cell"><span class="day-num">4</span></div>

      <div class="day-cell"><span class="day-num">5</span></div>
      <div class="day-cell"><span class="day-num">6</span></div>
      <div class="day-cell"><span class="day-num">7</span><span class="day-dot"></span></div>
      <div class="day-cell"><span class="day-num">8</span></div>
      <div class="day-cell"><span class="day-num">9</span></div>
      <div class="day-cell"><span class="day-num">10</span><span class="day-dot"></span></div>
      <div class="day-cell"><span class="day-num">11</span></div>

      <div class="day-cell"><span class="day-num">12</span></div>
      <div class="day-cell"><span class="day-num">13</span></div>
      <div class="day-cell"><span class="day-num">14</span><span class="day-dot"></span></div>
      <div class="day-cell"><span class="day-num">15</span></div>
      <div class="day-cell"><span class="day-num">16</span></div>
      <div class="day-cell"><span class="day-num">17</span></div>
      <div class="day-cell"><span class="day-num">18</span></div>

      <div class="day-cell"><span class="day-num">19</span></div>
      <div class="day-cell"><span class="day-num">20</span></div>
      <div class="day-cell"><span class="day-num">21</span><span class="day-dot"></span></div>
      <div class="day-cell"><span class="day-num">22</span></div>
      <div class="day-cell"><span class="day-num">23</span></div>
      <div class="day-cell"><span class="day-num">24</span><span class="day-dot"></span></div>
      <div class="day-cell"><span class="day-num">25</span></div>

      <div class="day-cell"><span class="day-num">26</span></div>
      <div class="day-cell"><span class="day-num">27</span><span class="day-dot"></span></div>
      <div class="day-cell today"><span class="day-num">28</span><span class="day-dot"></span></div>
      <div class="day-cell selected"><span class="day-num">29</span><span class="day-dot"></span></div>
      <div class="day-cell"><span class="day-num">30</span></div>
      <!-- 下月占位 -->
      <div class="day-cell other-month"><span class="day-num">1</span></div>
      <div class="day-cell other-month"><span class="day-num">2</span></div>
    </div>
  </div>

  <!-- 选中日期信息栏 -->
  <div class="date-info-bar">
    <div class="date-info-left">
      <span class="weekday">周三</span>
      <span style="color:#333;"> 4月29日</span>
      <span class="count">2 项日程</span>
    </div>
  </div>

  <!-- 日程列表 -->
  <div class="schedule-list">
    <!-- 日程1 -->
    <div class="schedule-card">
      <div class="card-top">
        <div class="check-circle"></div>
        <span class="card-title">项目周会</span>
      </div>
      <div class="card-meta">
        <span class="meta-tag tag-time">14:00</span>
        <span class="meta-tag tag-remind">🔔</span>
      </div>
    </div>

    <!-- 日程2 -->
    <div class="schedule-card">
      <div class="card-top">
        <div class="check-circle checked">✓</div>
        <span class="card-title completed">提交月度报告</span>
      </div>
      <div class="card-meta">
        <span class="meta-tag tag-time">10:00</span>
      </div>
      <div class="card-detail">需包含Q1数据对比</div>
    </div>

    <!-- 日程3: 另一天示例 -->
    <div class="schedule-card" style="opacity:0.4; border: 1px dashed #ccc;">
      <div class="card-top">
        <div class="check-circle"></div>
        <span class="card-title" style="color:#999;">+ 添加新日程</span>
      </div>
    </div>
  </div>

  <!-- FAB -->
  <div class="fab">+</div>
</div>

<!-- 标注说明 -->
<div style="position:fixed; right:40px; top:50%; transform:translateY(-50%); color:#666; font-size:13px; line-height:2; text-align:right;">
  <div>◂ ▸  左右切换月份</div>
  <div style="margin-top:12px;">🟢 今天高亮（半透明白底）</div>
  <div>⬜ 选中日期（白底绿字）</div>
  <div>🟡 金点 = 有日程</div>
  <div style="margin-top:12px;">点击日期 → 筛选该天日程</div>
  <div>点「全部 ▾」→ 显示所有日程</div>
  <div>点「+」→ 添加页自动填日期</div>
</div>

</body>
</html>
